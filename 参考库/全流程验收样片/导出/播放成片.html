<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>啊子牙视频工作室 · 19秒工程演示（非叙事质量样片）</title>
<style>body{background:#0b1018;color:#e5edf8;font:16px system-ui;margin:0 auto;max-width:1200px;padding:24px}h1{font-size:23px}video{width:100%;max-height:78vh;background:#000;border-radius:12px}button{background:#223246;color:#edf5ff;border:1px solid #45617e;border-radius:7px;padding:10px 14px;margin:5px;cursor:pointer}.controls{margin:12px 0}p{color:#a8b8ca}</style><h1>啊子牙视频工作室 · 19秒工程演示（非叙事质量样片）</h1><video id="v" controls playsinline></video><div id="versions" class="controls"></div><div class="controls"><button id="back">后退10秒</button><button id="forward">前进10秒</button></div><div id="chapters" class="controls"></div><p id="status"></p><script>
const data={"versions": [{"id": "bili", "label": "B站水印版", "url": "bili.mp4"}, {"id": "clean", "label": "无个人水印版", "url": "clean.mp4"}], "chapters": [{"start": 0.0, "title": "真实原文与默认声音"}, {"start": 6.28, "title": "星月动画独立重渲染"}, {"start": 14.28, "title": "完整姓名与作者片尾"}], "duration": 19.12},v=document.getElementById('v');
function load(version){const time=v.currentTime||0,playing=!v.paused;v.src=version.url;v.onloadedmetadata=()=>{v.currentTime=Math.min(time,v.duration);if(playing)v.play().catch(()=>{});};document.getElementById('status').textContent=version.label+' · '+Math.floor(data.duration/60)+'分'+(data.duration%60).toFixed(2)+'秒';}
data.versions.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.onclick=()=>load(x);document.getElementById('versions').append(b)});
data.chapters.forEach(x=>{const b=document.createElement('button');b.textContent=x.title;b.onclick=()=>{v.currentTime=x.start;v.play().catch(()=>{})};document.getElementById('chapters').append(b)});
document.getElementById('back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-10);document.getElementById('forward').onclick=()=>v.currentTime=Math.min(v.duration,v.currentTime+10);load(data.versions[0]);
</script></html>
