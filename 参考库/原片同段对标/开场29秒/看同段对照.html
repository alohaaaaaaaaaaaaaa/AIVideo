<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开场29秒 · 同段对照</title><style>body{background:#0c151a;color:#edf1ec;font:16px/1.8 system-ui;max-width:1200px;margin:auto;padding:24px}video{width:100%;aspect-ratio:16/9;background:#080c10}button,a{color:#b7ead7}button{background:#142229;border:1px solid #416253;border-radius:6px;padding:12px;margin:4px;cursor:pointer}button[aria-pressed=true]{background:#b7ead7;color:#10251e}p{color:#aec2c8}h1{font-size:28px}.shots{display:flex;flex-wrap:wrap}.shots button{font-size:13px}img{max-width:100%}</style><h1>同一段开场，直接比较。</h1><p>29.36秒：笑评 → 机场情境 → 私人飞机留言 → 央视原文 → 追查问题。切换版本会保留当前播放位置。</p><video id="v" controls playsinline preload="metadata"></video><div id="versions"></div><p id="status"></p><div class="shots" id="shots"></div><p>新版本重制首镜的全幅构图、实音划线与单一来源栏，按原片样式重新合成字幕和水印；其余7段沿用已迁入的原采用画面。原旁白保留，开场音乐按原音符和跨章音乐桥在本地重建，合成前29.36秒PCM逐样本一致。不是重新生成全部画面，也不是新一期成片。</p><p>原片完整帧率25fps；切出的参考段封装可能带有极短编码尾部，比较限于29.36秒。同画面参数对照不等于自动证明所有新题的审美质量。</p><a href="导出/播放成片.html">打开双版本播放器与章节</a> · <a href="../../网页取证/看网页参考.html">网页取证与动作范例</a> · <a href="../../../打开工作室.html">返回工作室</a><h2>第一幕构图</h2><img src="首镜_修复后.png" alt="修复后的全幅首镜"><script>
const v=document.getElementById('v'),status=document.getElementById('status');const versions=[['新工作室 · B站水印','导出/bili.mp4'],['新工作室 · 无个人水印','导出/clean.mp4'],['原采用成片 · 同段参考','原片_开场29秒.mp4']];
function load(i){let t=Math.min(v.currentTime||0,29.32),play=!v.paused;v.pause();v.src=versions[i][1];v.onloadedmetadata=()=>{v.currentTime=Math.min(t,v.duration);if(play)v.play().catch(()=>{})};status.textContent=versions[i][0];document.querySelectorAll('#versions button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));}
versions.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>load(i);document.getElementById('versions').append(b)});
[['笑评',0],['机场情境',5.32],['私人飞机留言',11.2],['央视标题',16.2],['网页定位',19.28],['核对日期机场',22.08],['接续调查',24.08]].forEach(([n,t])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{v.currentTime=t;v.play().catch(()=>{})};document.getElementById('shots').append(b)});v.addEventListener('timeupdate',()=>{if(v.currentTime>=29.36)v.pause()});load(0);
</script></html>
